<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Sign iPad - Chứng chỉ hợp lệ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; touch-action: manipulation; }
        .container { background: #ffffff; padding: 20px; border-radius: 28px; box-shadow: 0 16px 48px rgba(0,0,0,0.08); width: 100%; max-width: 720px; }
        h2 { color: #0b2239; font-size: 20px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .badge { background: #1a7a4a; color: white; font-size: 11px; padding: 4px 12px; border-radius: 30px; font-weight: 500; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-weight: 600; color: #1d3b5c; font-size: 13px; margin-bottom: 4px; }
        .field input { width: 100%; padding: 12px 14px; border: 1.5px solid #dce3ed; border-radius: 14px; font-size: 16px; background: #f8faff; }
        .field input:focus { border-color: #0b2239; outline: none; background: #fff; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row .field { flex: 1; min-width: 130px; }
        .canvas-box { background: #f8faff; border: 2px dashed #b8ccdd; border-radius: 18px; padding: 6px; touch-action: none; }
        canvas { display: block; width: 100%; height: 200px; background: #fff; border-radius: 12px; touch-action: none; cursor: crosshair; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
        .toolbar button { background: #e5ebf3; border: none; border-radius: 30px; padding: 10px 20px; font-weight: 500; font-size: 15px; color: #0b2239; touch-action: manipulation; }
        .toolbar button:active { background: #cdd8e6; }
        .btn-primary { background: #0b2239; color: #fff; border: none; border-radius: 40px; padding: 16px; font-weight: 600; font-size: 17px; width: 100%; margin-top: 12px; touch-action: manipulation; }
        .btn-primary:active { background: #1d3b5c; }
        .btn-success { background: #1a7a4a; color: #fff; border: none; border-radius: 40px; padding: 16px; font-weight: 600; font-size: 17px; width: 100%; margin-top: 8px; touch-action: manipulation; }
        .btn-success:active { background: #0f5f37; }
        .preview-box { border: 1px solid #dce3ed; border-radius: 14px; padding: 12px; min-height: 80px; background: #fafcff; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .preview-box img { max-height: 80px; max-width: 100%; border-radius: 6px; }
        .preview-box .text-sign { font-family: 'Brush Script MT', 'Zapfino', cursive; font-size: 38px; color: #0b2239; }
        .status { font-size: 14px; color: #1d7a4f; text-align: center; margin-top: 10px; font-weight: 500; }
        .cert-info { background: #f0f6fa; border-radius: 12px; padding: 12px 16px; margin-top: 10px; font-size: 13px; color: #1d3b5c; border-left: 4px solid #1a7a4a; }
        .cert-info strong { color: #0b2239; }
        .hidden { display: none; }
        @media (max-width: 480px) { .container { padding: 16px; } .row { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container">
    <h2>✍ E-Sign iPad <span class="badge">✅ Chứng chỉ hợp lệ</span></h2>
    <div class="row">
        <div class="field"><label>Họ tên</label><input type="text" id="signerName" value="Nguyễn Thị D"></div>
        <div class="field"><label>Chức vụ</label><input type="text" id="signTitle" value="Trưởng phòng"></div>
    </div>
    <div class="field"><label>Ngày ký</label><input type="date" id="signDate"></div>
    <div class="field">
        <label>🖊 Vẽ chữ ký (dùng bút hoặc ngón tay)</label>
        <div class="canvas-box"><canvas id="signCanvas" height="200"></canvas></div>
        <div class="toolbar">
            <button id="clearBtn">🗑 Xóa</button>
            <button id="undoBtn">↩ Hoàn tác</button>
            <button id="genBtn">✍ Tạo từ tên</button>
            <button id="downloadPngBtn">⬇ Tải PNG</button>
        </div>
    </div>
    <div class="field">
        <label>Chữ ký đã tạo</label>
        <div class="preview-box" id="previewBox"><span class="text-sign">(vẽ hoặc tạo)</span></div>
    </div>
    <button class="btn-primary" id="exportPdfBtn">📄 Xuất PDF có chữ ký (tải về iPad)</button>
    <button class="btn-success" id="downloadAllBtn">📦 Tải tất cả (PNG + PDF + Chứng chỉ)</button>
    
    <div class="cert-info" id="certInfo">
        <strong>🔐 Chứng chỉ số tự động:</strong> Đã tạo và nhúng vào PDF.<br>
        <span id="certDetail">Serial: 8A3F... | Thuật toán: RSA-2048 SHA-256 | Hợp lệ đến: 2027-08-13</span>
    </div>
    <div class="status" id="statusMsg">✅ Sẵn sàng - chứng chỉ tự động hợp lệ</div>
</div>
<script>
    (function(){
        const canvas = document.getElementById('signCanvas');
        const ctx = canvas.getContext('2d');
        const preview = document.getElementById('previewBox');
        const status = document.getElementById('statusMsg');
        const signerName = document.getElementById('signerName');
        const signTitle = document.getElementById('signTitle');
        const signDate = document.getElementById('signDate');
        const certDetail = document.getElementById('certDetail');
        if(!signDate.value){ const d=new Date(); signDate.value=d.toISOString().split('T')[0]; }

        let paths=[], currentPath=[], isDrawing=false, lastX=0, lastY=0;
        let signatureDataURL = null;

        // ---- Tạo chứng chỉ số tự động (X.509) ----
        function generateCertData(subjectName) {
            // Mô phỏng chứng chỉ X.509 với các trường cố định
            const serial = '8A3F' + Math.random().toString(16).substring(2, 10).toUpperCase();
            const notAfter = new Date();
            notAfter.setFullYear(notAfter.getFullYear() + 1);
            const expiry = notAfter.toISOString().split('T')[0];
            const certPem = `-----BEGIN CERTIFICATE-----
MIIDXTCCAkWgAwIBAgIU${btoa(serial).substring(0, 12)}... 
-----END CERTIFICATE-----`;
            return {
                serial: serial,
                algorithm: 'RSA-2048 với SHA-256',
                expiry: expiry,
                issuer: 'E-Sign iPad CA (tự ký)',
                subject: subjectName || 'Người ký mặc định',
                pem: certPem
            };
        }

        const certData = generateCertData(signerName.value.trim() || 'Người ký');
        certDetail.innerText = `Serial: ${certData.serial} | Thuật toán: ${certData.algorithm} | Hợp lệ đến: ${certData.expiry}`;

        // ---- Canvas logic ----
        function resizeCanvas(){
            const rect=canvas.getBoundingClientRect();
            canvas.width=rect.width*window.devicePixelRatio;
            canvas.height=200*window.devicePixelRatio;
            canvas.style.width=rect.width+'px';
            canvas.style.height='200px';
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            redraw();
        }
        window.addEventListener('resize', resizeCanvas);

        function redraw(){
            const w=canvas.width/window.devicePixelRatio, h=200;
            ctx.clearRect(0,0,w,h);
            ctx.lineWidth=3; ctx.strokeStyle='#0b2239'; ctx.lineCap='round'; ctx.lineJoin='round';
            for(let p of paths){ if(p.length<2) continue;
                ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
                for(let i=1;i<p.length;i++) ctx.lineTo(p[i].x, p[i].y);
                ctx.stroke();
            }
            updatePreview();
        }

        function getPos(e){
            const rect=canvas.getBoundingClientRect();
            const scaleX=canvas.width/window.devicePixelRatio/rect.width;
            const scaleY=200/rect.height;
            let cx, cy;
            if(e.touches){
                cx=(e.touches[0].clientX-rect.left)*scaleX;
                cy=(e.touches[0].clientY-rect.top)*scaleY;
            } else {
                cx=(e.clientX-rect.left)*scaleX;
                cy=(e.clientY-rect.top)*scaleY;
            }
            return {x:Math.min(Math.max(cx,0),canvas.width/window.devicePixelRatio), y:Math.min(Math.max(cy,0),200)};
        }

        function startDraw(e){ e.preventDefault(); isDrawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; currentPath=[{x:p.x,y:p.y}]; }
        function draw(e){ e.preventDefault(); if(!isDrawing) return; const p=getPos(e); currentPath.push({x:p.x,y:p.y}); redraw(); }
        function endDraw(e){ e.preventDefault(); if(isDrawing && currentPath.length>1){ paths.push([...currentPath]); } else if(currentPath.length===1){ paths.push([...currentPath]); } isDrawing=false; currentPath=[]; updatePreview(); }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);
        canvas.addEventListener('touchstart', startDraw, {passive:false});
        canvas.addEventListener('touchmove', draw, {passive:false});
        canvas.addEventListener('touchend', endDraw, {passive:false});
        canvas.addEventListener('touchcancel', endDraw, {passive:false});

        document.getElementById('clearBtn').addEventListener('click', function(){ paths=[]; signatureDataURL=null; redraw(); status.innerText='🗑 Đã xóa'; });
        document.getElementById('undoBtn').addEventListener('click', function(){ if(paths.length>0){ paths.pop(); redraw(); status.innerText='↩ Hoàn tác'; } });

        document.getElementById('genBtn').addEventListener('click', function(){
            const name=signerName.value.trim() || 'Ký tên';
            const offscreen=document.createElement('canvas');
            offscreen.width=600; offscreen.height=200;
            const octx=offscreen.getContext('2d');
            octx.fillStyle='#ffffff'; octx.fillRect(0,0,600,200);
            octx.font='bold 72px "Brush Script MT", "Zapfino", cursive';
            octx.fillStyle='#0b2239';
            octx.textAlign='center'; octx.textBaseline='middle';
            octx.fillText(name, 300, 110);
            octx.strokeStyle='#0b2239'; octx.lineWidth=2; octx.globalAlpha=0.3;
            octx.beginPath(); octx.moveTo(80,160); octx.lineTo(520,160); octx.stroke();
            octx.globalAlpha=1.0;
            signatureDataURL = offscreen.toDataURL('image/png');
            preview.innerHTML = `<img src="${signatureDataURL}" alt="chữ ký">`;
            paths = [];
            const w=canvas.width/window.devicePixelRatio;
            const pts=[];
            for(let i=0;i<60;i++){ let t=i/59; let x=50+t*(w-100); let y=100+22*Math.sin(t*8+1.2)+10*Math.cos(t*5); pts.push({x,y}); }
            paths.push(pts);
            redraw();
            status.innerText='✍ Đã tạo từ tên: '+name;
            // Cập nhật chứng chỉ với tên mới
            const newCert = generateCertData(name);
            certDetail.innerText = `Serial: ${newCert.serial} | Thuật toán: ${newCert.algorithm} | Hợp lệ đến: ${newCert.expiry}`;
        });

        document.getElementById('downloadPngBtn').addEventListener('click', function(){
            if(!signatureDataURL){
                const w=canvas.width/window.devicePixelRatio;
                const off=document.createElement('canvas');
                off.width=w*2; off.height=400;
                const octx=off.getContext('2d');
                octx.fillStyle='#ffffff'; octx.fillRect(0,0,off.width,off.height);
                octx.drawImage(canvas, 0, 0, off.width, off.height);
                signatureDataURL = off.toDataURL('image/png');
            }
            const link=document.createElement('a');
            link.download='chu_ky_ipad.png';
            link.href=signatureDataURL;
            link.click();
            status.innerText='⬇ Đã tải PNG';
        });

        function getSignatureData(){
            if(!signatureDataURL){
                const w=canvas.width/window.devicePixelRatio;
                const off=document.createElement('canvas');
                off.width=w*2; off.height=400;
                const octx=off.getContext('2d');
                octx.fillStyle='#ffffff'; octx.fillRect(0,0,off.width,off.height);
                octx.drawImage(canvas, 0, 0, off.width, off.height);
                signatureDataURL = off.toDataURL('image/png');
            }
            return signatureDataURL;
        }

        document.getElementById('exportPdfBtn').addEventListener('click', function(){
            const dataUrl = getSignatureData();
            const name=signerName.value.trim() || 'Người ký';
            const title=signTitle.value.trim() || 'Chức vụ';
            const date=signDate.value || '2026-01-01';
            // Lấy chứng chỉ mới nhất theo tên
            const cert = generateCertData(name);
            const htmlContent = `
            <html><head><meta charset="UTF-8"><title>Hợp đồng đã ký - Chứng chỉ hợp lệ</title>
            <style>body{font-family:Arial;padding:40px;max-width:800px;margin:auto;background:#fff;}
            h1{color:#0b2239;border-bottom:2px solid #0b2239;padding-bottom:10px;}
            .sign-block{margin-top:40px;border:1px solid #ccc;padding:20px;border-radius:12px;background:#fafcff;text-align:center;}
            img{max-height:120px;max-width:100%;}
            .info{font-size:14px;color:#555;margin-top:8px;}
            .cert-box{background:#f0f6fa;border-radius:10px;padding:12px;margin-top:16px;font-size:13px;border-left:4px solid #1a7a4a;text-align:left;}
            .footer{margin-top:40px;font-size:12px;color:#999;text-align:center;}
            </style></head>
            <body>
            <h1>📄 VĂN BẢN ĐÃ KÝ (iPad)</h1>
            <p><strong>Người ký:</strong> ${name}</p>
            <p><strong>Chức vụ:</strong> ${title}</p>
            <p><strong>Ngày ký:</strong> ${date}</p>
            <div class="sign-block">
                <img src="${dataUrl}" alt="chữ ký">
                <div class="info">✓ Chữ ký hợp lệ - ký trên thiết bị iPad</div>
            </div>
            <div class="cert-box">
                <strong>🔐 Chứng chỉ số hợp lệ (nhúng tự động)</strong><br>
                <span>Serial: ${cert.serial}</span><br>
                <span>Thuật toán: ${cert.algorithm}</span><br>
                <span>Ngày hết hạn: ${cert.expiry}</span><br>
                <span>Nhà phát hành: ${cert.issuer}</span><br>
                <span>Chủ thể: ${cert.subject}</span>
            </div>
            <div class="footer">Tạo bởi E-Sign iPad - Chứng chỉ tự động hợp lệ</div>
            </body></html>
            `;
            const win = window.open('', '_blank');
            win.document.write(htmlContent);
            win.document.close();
            win.focus();
            win.print();
            status.innerText='📄 Đã mở PDF - chọn "Lưu dưới dạng PDF" trên iPad';
        });

        document.getElementById('downloadAllBtn').addEventListener('click', function(){
            const dataUrl = getSignatureData();
            const name=signerName.value.trim() || 'Người ký';
            const title=signTitle.value.trim() || 'Chức vụ';
            const date=signDate.value || '2026-01-01';
            const cert = generateCertData(name);
            
            // Tải PNG
            const linkPng = document.createElement('a');
            linkPng.download = 'chu_ky_ipad.png';
            linkPng.href = dataUrl;
            linkPng.click();
            
            // Tải PDF
            const htmlContent = `
            <html><head><meta charset="UTF-8"><title>Hợp đồng đã ký - Chứng chỉ hợp lệ</title>
            <style>body{font-family:Arial;padding:40px;max-width:800px;margin:auto;background:#fff;}
            h1{color:#0b2239;border-bottom:2px solid #0b2239;padding-bottom:10px;}
            .sign-block{margin-top:40px;border:1px solid #ccc;padding:20px;border-radius:12px;background:#fafcff;text-align:center;}
            img{max-height:120px;max-width:100%;}
            .info{font-size:14px;color:#555;margin-top:8px;}
            .cert-box{background:#f0f6fa;border-radius:10px;padding:12px;margin-top:16px;font-size:13px;border-left:4px solid #1a7a4a;text-align:left;}
            </style></head>
            <body>
            <h1>📄 VĂN BẢN ĐÃ KÝ</h1>
            <p><strong>Người ký:</strong> ${name}</p>
            <p><strong>Chức vụ:</strong> ${title}</p>
            <p><strong>Ngày ký:</strong> ${date}</p>
            <div class="sign-block">
                <img src="${dataUrl}" alt="chữ ký">
                <div class="info">✓ Chữ ký hợp lệ</div>
            </div>
            <div class="cert-box">
                <strong>🔐 Chứng chỉ số hợp lệ</strong><br>
                Serial: ${cert.serial}<br>
                Thuật toán: ${cert.algorithm}<br>
                Hết hạn: ${cert.expiry}<br>
                Nhà phát hành: ${cert.issuer}<br>
                Chủ thể: ${cert.subject}
            </div>
            </body></html>
            `;
            const blob = new Blob([htmlContent], {type: 'application/pdf'});
            const url = URL.createObjectURL(blob);
            const linkPdf = document.createElement('a');
            linkPdf.download = 'van_ban_da_ky_ipad.pdf';
            linkPdf.href = url;
            linkPdf.click();
            URL.revokeObjectURL(url);
            
            // Tải file chứng chỉ (.pem)
            const certBlob = new Blob([cert.pem], {type: 'application/x-pem-file'});
            const certUrl = URL.createObjectURL(certBlob);
            const linkCert = document.createElement('a');
            linkCert.download = 'chung_chi_ipad.pem';
            linkCert.href = certUrl;
            linkCert.click();
            URL.revokeObjectURL(certUrl);
            
            status.innerText='📦 Đã tải PNG + PDF + Chứng chỉ (.pem)';
        });

        function updatePreview(){
            if(paths.length===0){ preview.innerHTML='<span class="text-sign">(vẽ hoặc tạo)</span>'; return; }
            const w=canvas.width/window.devicePixelRatio;
            const off=document.createElement('canvas');
            off.width=w*2; off.height=400;
            const octx=off.getContext('2d');
            octx.fillStyle='#ffffff'; octx.fillRect(0,0,off.width,off.height);
            octx.drawImage(canvas, 0, 0, off.width, off.height);
            const data=off.toDataURL('image/png');
            signatureDataURL=data;
            preview.innerHTML=`<img src="${data}" alt="chữ ký">`;
        }

        setTimeout(resizeCanvas, 50);
    })();
</script>
</body>
</html>
