<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Multiverse Battle 2D</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/mobile.css">

</head>

    <title>Multiverse Battle 2D</title>

</head>
    <div id="gameMap">

    <div id="mapName"></div>
        <div id="player" class="fighter"></div>

<div id="ally" class="fighter"></div>

<div id="boss" class="fighter boss"></div>

</div>
    <div id="mobileControls">

    <div id="joystick">

        <button ontouchstart="moveLeft()">◀</button>

        <button ontouchstart="moveRight()">▶</button>

        <button ontouchstart="jump()">▲</button>

    </div>


    <div id="attackButtons">

        <button ontouchstart="attack()">👊</button>

        <button ontouchstart="skill1()">⚡</button>

        <button ontouchstart="skill2()">🔥</button>

        <button ontouchstart="awaken()">💥</button>

    </div>

</div>
<body>

    <div id="startScreen">

    <h1>⚔️ MULTIVERSE BATTLE 2D</h1>

    <p>
        Player + Ally AI VS Boss AI
    </p>

    <button onclick="startGame()">
        ▶ BẮT ĐẦU
    </button>

</div>


<div id="characterMenu" style="display:none;">

    <!-- Toàn bộ menu chọn nhân vật của bạn đặt ở đây -->

</div>
<div id="game">

<canvas id="gameCanvas"></canvas>

<div id="ui">

<div id="goldUI">
🟡 0
</div>

<div id="playerHealth"
class="health-bar">

<div class="health-fill"></div>

</div>

<div id="enemyHealth"
class="health-bar">

<div class="health-fill"></div>

</div>

<div id="playerRage"
class="rage-bar">

<div class="rage-fill"></div>

</div>

<div id="enemyRage"
class="rage-bar">

<div class="rage-fill"></div>

</div>

</div>


<div id="arena">

<div class="player"></div>

<div class="ally"></div>

<div class="enemy"></div>

</div>


<div id="mobileControls">

<div id="joystick">

    <div id="stick"></div>

</div>

<div
class="attackBtn">

⚔️

</div>

<div
id="skill1"
class="skillBtn">

①

</div>

<div
id="skill2"
class="skillBtn">

②

</div>

<div
id="ultimate"
class="skillBtn">

🔥

</div>

</div>

</div>

<script src="js/characterData.js"></script>
<script src="js/player.js"></script>
<script src="js/enemyAI.js"></script>
<script src="js/battleSystem.js"></script>
<script src="js/maps.js"></script>
<script src="js/menu.js"></script>
<script src="js/engine.js"></script>

</body>
</html>
<div class="characterList">

    <h2>🔥 CHỌN NHÂN VẬT</h2>

    <div class="characters">

        <button onclick="chooseCharacter('Rick')">
            🧪 Rick
        </button>

        <button onclick="chooseCharacter('Morty')">
            🧪 Morty
        </button>

        <button onclick="chooseCharacter('Gojo')">
            🌀 Gojo
        </button>

        <button onclick="chooseCharacter('Goku')">
            🔥 Goku
        </button>

        <button onclick="chooseCharacter('Naruto')">
            🍥 Naruto
        </button>

        <button onclick="chooseCharacter('Sukuna')">
            👹 Sukuna
        </button>

    </div>


    <h2>👕 SKIN</h2>


    <div id="skinList">

        Chọn nhân vật để xem skin

    </div>


</div>
<canvas id="gameCanvas" width="1280" height="720"></canvas>
